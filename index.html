<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partnership Review System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181D; --ink-soft:#5A616E; --ink-faint:#8A909C;
    --bg:#ECEEF1; --card:#FFFFFF; --line:#E1E4E9; --line-soft:#EDEFF2;
    --brand:#E4002B; --accent:#2F6BE0; --accent-soft:#EAF0FC;
    --good:#10876B; --good-bg:#E4F3EE;
    --warn:#C98A00; --warn-bg:#FAF1DC;
    --bad:#D23B47;  --bad-bg:#FBE7E9;
    --track:#EDEFF2;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(20,24,31,.05),0 8px 24px -12px rgba(20,24,31,.12);
    --shadow-lg:0 12px 40px -12px rgba(20,24,31,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;font-size:14px}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}

  header.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;height:58px}
  .wordmark{font-family:'Space Grotesk';font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .wordmark .spade{width:16px;height:16px;background:var(--brand);border-radius:3px 3px 3px 8px;transform:rotate(45deg)}
  .wordmark small{font-weight:500;color:#9aa2b1;font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-left:2px}
  .top .spacer{flex:1}
  .top-btn{color:#c7cdd8;font-size:13px;font-weight:500;padding:7px 11px;border-radius:8px}
  .top-btn:hover{background:#252a33;color:#fff}
  .crumb{color:#9aa2b1;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
  .crumb b{color:#fff;font-weight:600}
  .crumb button{color:#9aa2b1}
  .crumb button:hover{color:#fff;text-decoration:underline}

  main{max-width:1180px;margin:0 auto;padding:26px 22px 90px}

  .port{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
  .port .cell{background:var(--card);padding:16px 18px}
  .port .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600}
  .port .v{font-family:'Space Grotesk';font-weight:700;font-size:24px;margin-top:5px;letter-spacing:-.02em}
  .port .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .port .v.pos{color:var(--good)} .port .v.neg{color:var(--bad)}

  .section-row{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
  .section-row h2{font-family:'Space Grotesk';font-weight:600;font-size:15px;margin:0;letter-spacing:-.01em}
  .filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chip{font-size:12.5px;font-weight:500;color:var(--ink-soft);padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

  .board{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .13s ease,box-shadow .13s ease,border-color .13s;position:relative;overflow:hidden}
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#d4d8df}
  .pcard .statusline{position:absolute;left:0;top:0;bottom:0;width:4px}
  .pcard.good .statusline{background:var(--good)} .pcard.warn .statusline{background:var(--warn)} .pcard.bad .statusline{background:var(--bad)} .pcard.none .statusline{background:var(--line)}
  .pcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:3px}
  .pcard .name{font-family:'Space Grotesk';font-weight:600;font-size:16.5px;letter-spacing:-.01em;margin:0}
  .pcard .cp{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .statusdot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .statusdot i{width:7px;height:7px;border-radius:50%}
  .sd-good{background:var(--good-bg);color:var(--good)} .sd-good i{background:var(--good)}
  .sd-warn{background:var(--warn-bg);color:var(--warn)} .sd-warn i{background:var(--warn)}
  .sd-bad{background:var(--bad-bg);color:var(--bad)} .sd-bad i{background:var(--bad)}
  .sd-none{background:var(--line-soft);color:var(--ink-faint)} .sd-none i{background:var(--ink-faint)}
  .snapmeta{font-size:11.5px;color:var(--ink-faint);font-weight:500;margin:2px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cat{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px}
  .verdict{font-size:13.5px;color:var(--ink);line-height:1.5;margin:0 0 14px;min-height:20px}
  .verdict.empty{color:var(--ink-faint);font-style:italic}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:12px}
  .metric .ml{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .metric .mlab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600}
  .metric .mval{font-family:'JetBrains Mono';font-weight:500;font-size:12px}
  .metric .mval .pct{font-weight:700;margin-left:5px}
  .metric .mval .pct.pos{color:var(--good)} .metric .mval .pct.neg{color:var(--bad)}
  .bar{position:relative;height:7px;background:var(--track);border-radius:4px;overflow:visible}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .bar .fill.pos{background:var(--good)} .bar .fill.neg{background:var(--bad)} .bar .fill.mid{background:var(--warn)}
  .bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
  .bar .tick::after{content:'';position:absolute;top:-4px;left:-2px;width:6px;height:4px;background:var(--ink);border-radius:0 0 3px 3px}
  .cardfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:11px;margin-top:2px}
  .valadd{font-size:12px;color:var(--ink-soft)}
  .valadd b{font-family:'JetBrains Mono';color:var(--good);font-weight:700}
  .callbadge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
  .call-renew{color:var(--good);border-color:var(--good)} .call-evolve{color:var(--accent);border-color:var(--accent)}
  .call-renegotiate{color:var(--warn);border-color:var(--warn)} .call-exit{color:var(--bad);border-color:var(--bad)}
  .addcard{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:var(--radius);background:transparent;color:var(--ink-soft);font-weight:500;min-height:120px;font-size:14px;gap:8px}
  .addcard:hover{border-color:var(--accent);color:var(--accent);background:var(--card)}
  .empty-state{text-align:center;padding:70px 20px;color:var(--ink-soft)}
  .empty-state h3{font-family:'Space Grotesk';color:var(--ink);font-size:18px;margin:0 0 6px}

  .detail-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
  .dh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .dh-name{font-family:'Space Grotesk';font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0}
  .dh-cp{color:var(--ink-soft);font-size:13.5px;margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dh-term{font-size:12.5px;color:var(--ink-faint)}
  .dh-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .snap-select{display:flex;align-items:center;gap:8px}
  .snap-select label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600}
  select.sel,input.inp,textarea.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
  select.sel{padding-right:26px}
  input.inp:focus,textarea.inp:focus,select.sel:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .snap-select select{width:auto;min-width:190px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}.board{grid-template-columns:1fr}.port{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
  .panel-head h3{font-family:'Space Grotesk';font-weight:600;font-size:14px;margin:0;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  .panel-head .lil{font-size:11px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .panel-body{padding:18px}
  .linkbtn{color:var(--accent);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:7px}
  .linkbtn:hover{background:var(--accent-soft)}

  .comm-metric{margin-bottom:20px}
  .comm-metric:last-child{margin-bottom:0}
  .comm-metric .cm-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .comm-metric .cm-name{font-weight:600;font-size:13.5px}
  .comm-metric .cm-fig{font-family:'JetBrains Mono';font-size:13px}
  .comm-metric .cm-fig .a{font-weight:700;font-size:15px}
  .comm-metric .cm-fig .e{color:var(--ink-faint)}
  .comm-metric .cm-delta{font-family:'JetBrains Mono';font-weight:700;font-size:12.5px;margin-left:8px}
  .comm-metric .cm-delta.pos{color:var(--good)} .comm-metric .cm-delta.neg{color:var(--bad)}
  .bar.big{height:11px}

  /* components (shows / packages) */
  .comp{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 15px;margin-bottom:12px;background:#fcfcfd}
  .comp:last-child{margin-bottom:0}
  .comp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:11px}
  .comp-name{font-weight:600;font-size:14px}
  .comp-mode{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);background:var(--line-soft);padding:2px 6px;border-radius:4px;font-weight:600;margin-left:7px}
  .comp-inv{font-family:'JetBrains Mono';font-weight:700;font-size:14px}
  .comp-inv small{display:block;font-family:'Inter';font-weight:500;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;text-align:right}
  .aud-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:5px}
  .aud-row .mlab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600}
  .aud-row .mono{font-weight:500}
  .cpm-line{display:flex;gap:16px;margin-top:9px;font-size:12px;color:var(--ink-soft)}
  .cpm-line b{font-family:'JetBrains Mono'}
  .comp-ent{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
  .comp-ent summary{font-size:11.5px;color:var(--accent);font-weight:600;cursor:pointer;list-style:none}
  .comp-ent summary::-webkit-details-marker{display:none}
  .ent-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .ent-chip{font-size:11px;background:var(--line-soft);color:var(--ink-soft);padding:3px 8px;border-radius:5px}
  .comp-editbtn{opacity:0;color:var(--ink-faint);font-size:13px;padding:2px 7px;border-radius:5px}
  .comp:hover .comp-editbtn{opacity:1}
  .comp-editbtn:hover{background:var(--line-soft);color:var(--ink)}
  .media-total{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--line);margin-top:4px;padding-top:12px;font-size:13px}
  .media-total .mt-l{font-weight:700}
  .media-total .mt-r{font-family:'JetBrains Mono';font-weight:700;text-align:right}
  .media-total .mt-r small{display:block;font-family:'Inter';font-weight:500;font-size:11px;color:var(--ink-soft)}

  .quads{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);margin-bottom:16px}
  .quad{background:var(--card);padding:14px 15px;min-height:96px}
  .quad h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:0 0 9px;display:flex;align-items:center;gap:7px}
  .quad h4 .qi{width:6px;height:6px;border-radius:50%}
  .quad.win h4{color:var(--good)} .quad.win h4 .qi{background:var(--good)}
  .quad.fall h4{color:var(--bad)} .quad.fall h4 .qi{background:var(--bad)}
  .quad.deliv h4{color:var(--ink-soft)} .quad.deliv h4 .qi{background:var(--ink-soft)}
  .quad.evo h4{color:var(--accent)} .quad.evo h4 .qi{background:var(--accent)}
  .quad ul{margin:0;padding-left:16px} .quad li{font-size:12.5px;margin-bottom:6px;line-height:1.42}
  .quad .none{font-size:12.5px;color:var(--ink-faint);font-style:italic}

  /* strategic levers */
  .levers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:860px){.levers{grid-template-columns:1fr 1fr}}
  .lever{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;background:#fcfcfd}
  .lever .lv-h{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .lever .lv-name{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--ink)}
  .lever .lv-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .lv-dot.good{background:var(--good)} .lv-dot.watch{background:var(--warn)} .lv-dot.concern{background:var(--bad)} .lv-dot.none{background:var(--line)}
  .lever .lv-note{font-size:12px;color:var(--ink-soft);line-height:1.45}
  .lever .lv-note.empty{color:var(--ink-faint);font-style:italic}

  .flag{}
  .verdict-panel{border-top:3px solid var(--accent)}
  .vp-status{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .vp-opt{flex:1;min-width:90px;text-align:center;padding:9px;border-radius:9px;border:1.5px solid var(--line);font-weight:600;font-size:12.5px;color:var(--ink-soft)}
  .vp-opt.sel-good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
  .vp-opt.sel-warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
  .vp-opt.sel-bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;margin-bottom:6px}
  .field .hint{font-size:11.5px;color:var(--ink-faint);font-weight:400;text-transform:none;letter-spacing:0;margin-top:5px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:9px 15px;border-radius:9px;transition:.12s}
  .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:#2559c4}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)} .btn-ghost:hover{border-color:var(--ink-soft)}
  .btn-danger{color:var(--bad)} .btn-danger:hover{background:var(--bad-bg)}

  .scrim{position:fixed;inset:0;background:rgba(20,24,31,.42);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .16s ease}
  .modal.wide{max-width:700px}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{font-family:'Space Grotesk';font-weight:600;font-size:16px;margin:0}
  .modal-body{padding:20px 22px;max-height:68vh;overflow-y:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .x{font-size:20px;color:var(--ink-faint);padding:4px 8px;border-radius:6px;line-height:1} .x:hover{background:var(--line-soft);color:var(--ink)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:80;box-shadow:var(--shadow-lg);animation:pop .16s}
  .example-tag{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:5px;text-transform:uppercase}

  /* view-as toggle */
  .viewas{display:flex;align-items:center;gap:10px}
  .viewas .email{color:#9aa2b1;font-size:12px}
  .vtoggle{display:flex;background:#252a33;border-radius:8px;padding:3px}
  .vtoggle button{font-size:12px;font-weight:600;color:#9aa2b1;padding:5px 11px;border-radius:6px}
  .vtoggle button.on{background:var(--accent);color:#fff}

  /* partner portal */
  .pbanner{background:linear-gradient(180deg,var(--ink),#1e222b);color:#fff;border-radius:var(--radius);padding:22px 24px;margin-bottom:18px}
  .pbanner .pb-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9aa2b1;font-weight:600}
  .pbanner h1{font-family:'Space Grotesk';font-weight:700;font-size:24px;margin:5px 0 8px;letter-spacing:-.01em}
  .pbanner p{margin:0;color:#c7cdd8;font-size:13.5px;max-width:640px;line-height:1.5}
  .pbanner .pb-note{margin-top:12px;font-size:12px;color:#9aa2b1;display:flex;align-items:center;gap:7px}
  .pbanner .pb-note i{width:7px;height:7px;border-radius:50%;background:var(--warn)}

  .pshow{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .pshow-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
  .pshow-head .ps-name{font-family:'Space Grotesk';font-weight:600;font-size:16px}
  .pshow-head .ps-sum{font-size:12px;color:var(--ink-soft);text-align:right}
  .pshow-head .ps-sum b{font-family:'JetBrains Mono';color:var(--ink);font-weight:700;font-size:14px;display:block}
  .pshow-body{padding:18px 20px}

  .wk-list{margin-bottom:14px}
  .wk-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--line-soft);border-radius:8px;margin-bottom:7px;font-size:13px}
  .wk-item .wk-l{display:flex;align-items:center;gap:10px}
  .wk-item .wk-aud{font-family:'JetBrains Mono';font-weight:600}
  .wk-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:5px}
  .wk-pending{background:var(--warn-bg);color:var(--warn)} .wk-verified{background:var(--good-bg);color:var(--good)}
  .wk-empty{font-size:13px;color:var(--ink-faint);font-style:italic;margin-bottom:12px}

  .wkform{background:#fafbfc;border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px}
  .wkform h5{font-family:'Space Grotesk';font-size:13px;margin:0 0 12px;font-weight:600}
  .wk-sub{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;margin:14px 0 8px}

const n=v=>(v===''||v===null||v===undefined||isNaN(+v))?null:+v;
function money(v){ if(v===null||v===''||isNaN(+v))return '—'; const x=+v;

function deliveredFromWeeks(c){ const ws=weeksOf(c); if(!ws.length)return null; return ws.reduce((a,w)=>a+weekAudTotal(w),0); }
function weeksLogged(c){ return weeksOf(c).length; }
function assetDeliveredTotal(c,assetId){ return weeksOf(c).reduce((a,w)=>a+(+((w.assets||{})[assetId])||0),0); }
/* Verified-only variants — used anywhere a figure is meant to agree with the entitlement panel,
   which counts only submissions PointsBet has verified (pending submissions are excluded). */
function verifiedWeeksOf(c){ return weeksOf(c).filter(w=>w.status==='verified'); }
function verifiedWeeksLogged(c){ return verifiedWeeksOf(c).length; }
function verifiedAssetDeliveredTotal(c,assetId){ return verifiedWeeksOf(c).reduce((a,w)=>a+(+((w.assets||{})[assetId])||0),0); }
function audDelivered(c){ const dw=deliveredFromWeeks(c); return dw!==null?dw:n(c.audienceDelivered); }

/* media roll-up for a snapshot */
function mediaRoll(s){
  let inv=0,guar=0,del=0,hasAud=false,hasInv=false;
  (s.media.components||[]).forEach(c=>{
    const ci=n(c.investment); if(ci!==null){inv+=ci;hasInv=true;}
    if(c.mode==='audience'){ const g=n(c.audienceGuaranteed),d=audDelivered(c);
      if(g!==null){guar+=g;hasAud=true;} if(d!==null)del+=d; }
  });
  return { inv:hasInv?inv:null, guar:hasAud?guar:null, del:del||null, hasAud,
    propCpm:(hasInv&&guar)?cpm(inv,guar):null, delCpm:(hasInv&&del)?cpm(inv,del):null };
}
/* delivered "value realised" for fixed / fulfilment components (dollar sense) */
function compRealised(c){
  const inv=n(c.investment)||0;
  if(c.mode==='fixed') return c.fixedDelivered?inv:0;
  if(c.mode==='fulfilment'){ const d=n(c.deliveredQty),ct=n(c.contractedQty); if(d===null||!ct)return null; return inv*Math.min(d/ct,1); }
  return null; // audience handled via CPM/reach
}

function bar(act,exp,big){
  const a=n(act),e=n(exp);
  if(a===null&&e===null)return `<div class="bar ${big?'big':''}"></div>`;
  const max=Math.max(a||0,e||0)*1.15||1;
  let cls='mid'; if(a!==null&&e!==null)cls=a>=e?'pos':(a>=e*0.85?'mid':'neg');
  return `<div class="bar ${big?'big':''}"><div class="fill ${cls}" style="width:${Math.min((a||0)/max*100,100)}%"></div>${e!==null?`<div class="tick" style="left:${Math.min((e||0)/max*100,100)}%"></div>`:''}</div>`;
}
/* bar where LOWER is better (CPM): fill green if act<=exp */
function barInverse(act,exp){
  const a=n(act),e=n(exp); if(a===null)return `<div class="bar"></div>`;
  const max=Math.max(a,e||0)*1.15||1;
  const cls=(e!==null)?(a<=e?'pos':(a<=e*1.15?'mid':'neg')):'mid';
  return `<div class="bar"><div class="fill ${cls}" style="width:${Math.min(a/max*100,100)}%"></div>${e!==null?`<div class="tick" style="left:${Math.min(e/max*100,100)}%"></div>`:''}</div>`;
}

function pcard(p){

  const stLabel={good:'On track',warn:'Watch',bad:'Off track',none:'Not set'}[st];
  const hasNgr=n(s.commercial.ngrExp)!==null||n(s.commercial.ngrAct)!==null;
  const m=mediaRoll(s);
  let metricsHtml;
  if(hasNgr){
    const ngrP=pctDiff(s.commercial.ngrAct,s.commercial.ngrExp), actP=pctDiff(s.commercial.activesAct,s.commercial.activesExp);
    metricsHtml=`<div class="metrics">
      <div class="metric"><div class="ml"><span class="mlab">NGR</span><span class="mval">${money(s.commercial.ngrAct)}${ngrP!==null?`<span class="pct ${ngrP>=0?'pos':'neg'}">${ngrP>0?'+':''}${ngrP}%</span>`:''}</span></div>${bar(s.commercial.ngrAct,s.commercial.ngrExp)}</div>
      <div class="metric"><div class="ml"><span class="mlab">Actives</span><span class="mval">${num(s.commercial.activesAct)}${actP!==null?`<span class="pct ${actP>=0?'pos':'neg'}">${actP>0?'+':''}${actP}%</span>`:''}</span></div>${bar(s.commercial.activesAct,s.commercial.activesExp)}</div>
    </div>`;
  } else {
    const audP=pctDiff(m.del,m.guar);

    metricsHtml=`<div class="metrics">
      <div class="metric"><div class="ml"><span class="mlab">Audience</span><span class="mval">${m.del!==null?aud(m.del):(m.guar!==null?aud(m.guar)+' guar':'—')}${audP!==null?`<span class="pct ${audP>=0?'pos':'neg'}">${audP>0?'+':''}${audP}%</span>`:''}</span></div>${m.del!==null?bar(m.del,m.guar):bar(m.guar,m.guar)}</div>
      <div class="metric"><div class="ml"><span class="mlab">CPM</span><span class="mval">${cpmDelivered!==null?'$'+cpmDelivered.toFixed(2):(cpmProp!==null?'$'+cpmProp.toFixed(2)+' proj':'—')}${cpmDelivered!==null&&cpmProp!==null?`<span class="pct ${cpmDelivered<=cpmProp?'pos':'neg'}">${cpmDelivered<=cpmProp?'▼':'▲'}</span>`:''}</span></div>${cpmDelivered!==null?barInverse(cpmDelivered,cpmProp):bar(0,1)}</div>
    </div>`;

      <span class="statusdot sd-${st}"><i></i>${stLabel}</span></div>
    <div class="snapmeta"><span class="cat">${esc(p.category)}</span> · ${esc(s.label)} · ${fmtDate(s.date)}</div>
    <p class="verdict ${s.verdict?'':'empty'}">${s.verdict?esc(s.verdict):'No verdict written yet'}</p>
    ${metricsHtml}
    <div class="cardfoot">
      <span class="valadd">${va?`Value-add <b>${money(va)}</b>`:(overDel?`Audience over-delivery <b>+${aud(overDel)}</b>`:'<span style="color:var(--ink-faint)">'+(m.inv!==null?money(m.inv)+' invested':'—')+'</span>')}</span>
      ${s.call?`<span class="callbadge call-${s.call}">${s.call}</span>`:''}
    </div>
  </div>`;
}

/* Live data comes from verified pr_week submissions only — a month with no verified
   submission for a show shows as a gap ("–"), it never falls back to any placeholder. */
function platformBucket(name){ if(name==='YouTube')return 'yt'; if(name==='Acast')return 'ac'; return 'soc'; }
function parseMonthKey(lbl){ const d=new Date(lbl); const t=d.getTime(); return isNaN(t)?null:t; }
function sortMonthLabels(labels){ return labels.slice().sort((a,b)=>{ const da=parseMonthKey(a),db=parseMonthKey(b); if(da!==null&&db!==null)return da-db; return a<b?-1:(a>b?1:0); }); }
function liveShowMonthly(comp){
  const data={}, tiktok={};
  weeksOf(comp).filter(w=>w.status==='verified').forEach(w=>{
    const mo=w.label; if(!mo) return;
    const bucket=data[mo]||(data[mo]={yt:0,soc:0,ac:0});
    Object.entries(w.audience||{}).forEach(([plat,v])=>{
      const val=+v||0; bucket[platformBucket(plat)]+=val;
      if(plat==='TikTok') tiktok[mo]=(tiktok[mo]||0)+val;
    });
  });
  return {data,tiktok};
}
function monthlyGraphPanel(p){
  const s=currentSnap(p);
  const staticM=MONTHLY[p.name];
  const staticMonths=staticM?staticM.months.slice():[];
  const staticShows=staticM?staticM.shows:{};
  const staticTiktok=staticM?staticM.tiktok:{};

  /* merge: static months are locked history and are never overwritten by a live submission
     that happens to reuse the same label; live submissions only ever add new months. */
  const shows={};
  Object.keys(staticShows).forEach(nm=>{ shows[nm]={ baselineUntil:staticShows[nm].baselineUntil, data:{...staticShows[nm].data} }; });
  const liveTiktok={};
  (s.media.components||[]).filter(c=>c.mode==='audience'&&(c.platforms||[]).length).forEach(c=>{
    const {data:liveData,tiktok:liveTk}=liveShowMonthly(c);
    const newMonths=Object.keys(liveData).filter(mo=>!staticMonths.includes(mo));
    if(newMonths.length){ if(!shows[c.name])shows[c.name]={baselineUntil:null,data:{}}; newMonths.forEach(mo=>{ shows[c.name].data[mo]=liveData[mo]; }); }
    else if(!shows[c.name] && Object.keys(liveData).length){ shows[c.name]={baselineUntil:null,data:{}}; }
    Object.entries(liveTk).forEach(([mo,v])=>{ if(!staticMonths.includes(mo)) liveTiktok[mo]=(liveTiktok[mo]||0)+v; });
  });
  const showNames=Object.keys(shows);
  if(!showNames.length) return '';

  const liveMonthSet=new Set();
  showNames.forEach(nm=>Object.keys(shows[nm].data).forEach(mo=>{ if(!staticMonths.includes(mo)) liveMonthSet.add(mo); }));
  const months=[...staticMonths, ...sortMonthLabels([...liveMonthSet])];
  const tiktok={...staticTiktok, ...liveTiktok};
  const M={months, shows, tiktok};

  const metric=view.graphMetric||'total';
  const METRICS=[['total','Total'],['yt','YouTube'],['soc','Social (FB+IG)'],['ac','Acast']];
  const val=d=> !d?null:(metric==='total'?(d.yt+d.soc+d.ac):d[metric]);
  const palette=['#2F6BE0','#7A5AF8','#EC7B4E','#1D9A6C'];
  const colors={}; showNames.forEach((s,i)=>colors[s]=palette[i%palette.length]);
  if(!view.graphShows) view.graphShows=['Kenty Blitz'];
  const active=showNames.filter(s=>view.graphShows.includes(s));
  const A=active.length?active:showNames;
  let max=0; M.months.forEach(mo=>A.forEach(s=>{const v=val(M.shows[s].data[mo]); if(v!==null&&v>max)max=v;}));
  max=max*1.14||1;
  const W=640,H=290,top=42,base=238,x0=34,plotW=W-46;
  const groupW=plotW/M.months.length, barW=Math.min(34,(groupW-26)/A.length);
  let bars='';
  M.months.forEach((mo,gi)=>{
    const gx=x0+gi*groupW;
    A.forEach((s,si)=>{
      const sh=M.shows[s], d=sh.data[mo], v=val(d);
      const spread=A.length*barW+(A.length-1)*6;
      const bx=gx+groupW/2-spread/2+si*(barW+6);
      if(v===null){ bars+=`<text x="${(bx+barW/2).toFixed(1)}" y="${base-4}" text-anchor="middle" font-size="10" fill="#B8BDC7">–</text>`; return; }
      const h=(v/max)*(base-top);
      const baseline=sh.baselineUntil && M.months.indexOf(mo)<=M.months.indexOf(sh.baselineUntil);
      const col=colors[s];
      bars+=`<rect x="${bx.toFixed(1)}" y="${(base-h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}" ${baseline?`fill-opacity="0.28" stroke="${col}" stroke-dasharray="3 2"`:''}></rect>`;
      bars+=`<text x="${(bx+barW/2).toFixed(1)}" y="${(base-h-5).toFixed(1)}" text-anchor="middle" font-size="9" fill="#5A616E" font-family="'JetBrains Mono',monospace">${aud(v)}</text>`;
    });
    bars+=`<text x="${(gx+groupW/2).toFixed(1)}" y="${base+16}" text-anchor="middle" font-size="11" fill="#5A616E" font-weight="600">${mo}</text>`;
  });
  const showChips=showNames.map(s=>`<label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;margin-right:14px;cursor:pointer"><input type="checkbox" ${view.graphShows.includes(s)?'checked':''} onchange="toggleGraphShow('${s}')" style="accent-color:${colors[s]};cursor:pointer"><span style="width:10px;height:10px;border-radius:2px;background:${colors[s]};display:inline-block"></span>${esc(s)}</label>`).join('');
  const baseNote = A.some(s=>M.shows[s].baselineUntil) ? `<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-faint)"><span style="width:10px;height:10px;border-radius:2px;background:${palette[1]};opacity:.35;border:1px dashed ${palette[1]};display:inline-block"></span>pre-sponsorship (not counted)</span>` : '';
  const btns=METRICS.map(([k,l])=>`<button class="chip ${metric===k?'on':''}" onclick="setGraphMetric('${k}')">${l}</button>`).join('');
  // month-over-month (last two months present), for selected shows + metric
  const withData=M.months.filter(mo=>A.some(s=>M.shows[s].data[mo]));
  const last=withData[withData.length-1], prev=withData[withData.length-2];
  let mom='';
  if(last&&prev){
    const cells=A.map(s=>{ const a=val(M.shows[s].data[last]), b=val(M.shows[s].data[prev]);

    comp=`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;margin-bottom:8px">Audience composition · July — backs the Audience lever</div>

      ${compShows.map(s=>{const d=COMPOSITION[s];return `<tr><td>${esc(s)}</td><td class="num">${d.male}%</td><td>${esc(d.ageTop)}</td><td class="num">${d.au}%</td><td>${esc(d.device)}</td></tr>`;}).join('')}
      </tbody></table></div>`;
  }
  return `<div class="panel"><div class="panel-head"><h3>Monthly performance</h3><div class="filters">${btns}</div></div><div class="panel-body">
    <div style="margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 0">${showChips}${baseNote}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%;display:block"><line x1="${x0}" y1="${base}" x2="${W-10}" y2="${base}" stroke="#E1E4E9"/>${bars}</svg>
    ${mom}
    ${Object.keys(M.tiktok).length?`<div style="margin-top:8px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line-soft);padding-top:10px"><b>TikTok — Fanatics channel total</b> (channel-wide, not show-attributable): ${M.months.filter(mo=>M.tiktok[mo]!=null).map(mo=>mo+' '+aud(M.tiktok[mo])).join(' · ')}.</div>`:''}
    <div style="margin-top:6px;font-size:11.5px;color:var(--ink-faint)">${staticMonths.length?`RLI Mar–May greyed as pre-sponsorship baseline (delivery clock from June). Kenty Blitz includes Ask Kenty. ${staticMonths.join('–')} figures from Fanatics' reissued per-platform reports.`:''} ${liveMonthSet.size?`${sortMonthLabels([...liveMonthSet]).join(', ')} from partner-submitted monthly reports, counted once PointsBet verifies them.`:''}</div>
    ${comp}
  </div></div>`;
}

/* ===== Entitlement delivery (per-round schedule; monthly target = per-round × rounds that month) =====
   Schedule now comes straight off each component's own `assets` array — the same list partners see and
   submit against in "Log a month" — instead of a separate hand-maintained table, so the two can't drift.
   Delivered figures come only from verified pr_week rows; nothing here is hand-typed or sample data. */
const ENT = {
  months:['Mar','Apr','May','Jun'],       // locked NRL-round history, pre-dates the live submission flow
  rounds:{Mar:4, Apr:4, May:5, Jun:4}     // rounds per month — real schedule fact, owner-editable per month
};
function entitlementPanel(p){
  const s=currentSnap(p);
  const comps=(s.media.components||[]).filter(c=>(c.assets||[]).length);
  if(!comps.length) return '';

  const liveMonthSet=new Set();
  comps.forEach(c=>weeksOf(c).filter(w=>w.status==='verified').forEach(w=>{ if(w.label && !ENT.months.includes(w.label)) liveMonthSet.add(w.label); }));
  const months=[...ENT.months, ...sortMonthLabels([...liveMonthSet])];

  if(!view.entMonth || !months.includes(view.entMonth)) view.entMonth=months[months.length-1];
  const mo=view.entMonth, rounds=ENT.rounds[mo]||0;
  const monthChips=months.map(m=>`<button class="chip ${m===mo?'on':''}" onclick="setEntMonth('${m}')">${m}</button>`).join('');
  const inp=(val,ph,handler,w)=>`<input type="number" value="${val}" placeholder="${ph||''}" onchange="${handler}" style="width:${w}px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-family:'JetBrains Mono',monospace;font-size:12px">`;
  let body='';
  comps.forEach(c=>{
    let onT=0,scored=0;
    const verifiedThisMonth=weeksOf(c).filter(w=>w.status==='verified'&&w.label===mo);
    const rows=c.assets.map(e=>{
      const target=(+e.perWeek||0)*rounds;
      const has=verifiedThisMonth.some(w=>(w.assets||{})[e.id]!==undefined&&(w.assets||{})[e.id]!==null&&(w.assets||{})[e.id]!=='');
      const dv=has?verifiedThisMonth.reduce((a,w)=>a+(+((w.assets||{})[e.id])||0),0):null;
      const pct=(has&&target>0)?Math.round(dv/target*100):null;
      if(has&&target>0){scored++; if(pct>=100)onT++;}
      const cls=pct===null?'':(pct>=100?'good':(pct>=85?'warn':'bad'));
      const status=pct===null?'<span style="color:var(--ink-faint)">—</span>':`<b style="font-family:'JetBrains Mono',monospace;color:var(--${cls})">${pct}%</b>`;
      return `<tr><td>${esc(e.name)}</td>
        <td class="num">${inp(e.perWeek,'',`setAssetPerWeek('${c.id}','${e.id}',this.value)`,42)}</td>
        <td class="num">${target}</td>
        <td class="num">${has?dv:'<span style="color:var(--ink-faint)">—</span>'}</td>
        <td class="num">${status}</td></tr>`;
    }).join('');
    const summ=scored?`${onT}/${scored} on target`:(verifiedThisMonth.length?'submitted, none scoreable':'no verified submission');
    const summCls=scored&&onT===scored?'var(--good)':(scored?'var(--warn)':'var(--ink-faint)');
    body+=`<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-weight:600;font-size:13.5px">${esc(c.name)}</span><span style="font-size:12px;color:${summCls};font-weight:600">${summ}</span></div>
      <table class="dtable"><thead><tr><th>Entitlement</th><th class="num">/round</th><th class="num">Target</th><th class="num">Delivered</th><th class="num">Fulfil</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  });
  return `<div class="panel"><div class="panel-head"><h3>Entitlement delivery</h3><div class="filters">${monthChips}</div></div><div class="panel-body">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px">
      <span style="color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:600">NRL rounds in ${mo}</span>
      ${inp(rounds,'',`setEntRounds('${mo}',this.value)`,52)}
      <span style="color:var(--ink-faint);font-size:12px">target = per-round × rounds · edit /round when the contract changes · override rounds for bye/Origin months</span>
    </div>
    ${body}
    <div style="margin-top:14px;font-size:11.5px;color:var(--ink-faint)">Delivered figures are drawn only from partner submissions PointsBet has verified — pending submissions aren't counted until reviewed. Shows with no assets schedule (e.g. Take the Points) don't appear here.</div>
  </div></div>`;
}
function setEntMonth(m){ view.entMonth=m; render(); }
function setEntRounds(m,v){ ENT.rounds[m]=+v||0; render(); }
async function setAssetPerWeek(cid,id,v){
  const s=curSnap(); const c=(s.media.components||[]).find(x=>x.id===cid); const e=c&&(c.assets||[]).find(x=>x.id===id);
  if(!e)return; e.perWeek=+v||0; await persist(); render();
}
Object.assign(window,{setEntMonth,setEntRounds,setAssetPerWeek});

function commMetric(name,act,exp,p,fmt){
  return `<div class="comm-metric"><div class="cm-head"><span class="cm-name">${name}</span>
    <span class="cm-fig"><span class="a">${fmt(act)}</span> <span class="e">/ ${fmt(exp)} exp</span>${p!==null?`<span class="cm-delta ${p>=0?'pos':'neg'}">${p>0?'+':''}${p}%</span>`:''}</span></div>${bar(act,exp,true)}</div>`;
}
function componentBlock(comp){
  const inv=n(comp.investment);
  const wl=weeksLogged(comp);
  let body='';
  if(comp.mode==='audience'){
    const g=n(comp.audienceGuaranteed),d=audDelivered(comp);
    const audP=pctDiff(d,g); const pc=cpm(inv,g),dc=cpm(inv,d);
    const src=wl?` <span style="color:var(--ink-faint);font-weight:400;font-size:11px">(from ${wl} week${wl>1?'s':''})</span>`:'';
    body=`<div class="aud-row"><span class="mlab">Audience</span><span class="mono">${d!==null?aud(d)+' delivered':aud(g)+' projected'}${g!==null&&d!==null?' / '+aud(g)+' guar':''}${audP!==null?` <span style="color:var(--${audP>=0?'good':'bad'});font-weight:700">(${audP>0?'+':''}${audP}%)</span>`:''}${src}</span></div>
      ${d!==null?bar(d,g):bar(g,g)}
      <div class="cpm-line">${pc!==null?`Proposed CPM <b>$${pc.toFixed(2)}</b>`:''}${dc!==null?` → delivered <b style="color:var(--${dc<=pc?'good':'bad'})">$${dc.toFixed(2)}</b>`:''}</div>`;
  } else if(comp.mode==='fixed'){
    body=`<div class="cpm-line">${comp.fixedDelivered?'<b style="color:var(--good)">Delivered</b> — full value counted':'<span style="color:var(--ink-faint)">Not yet delivered</span>'}</div>`;
  } else {
    const d=n(comp.deliveredQty),ct=n(comp.contractedQty); const r=compRealised(comp);
    body=`<div class="aud-row"><span class="mlab">Fulfilment</span><span class="mono">${d!==null?d:'—'} of ${ct||'—'} ${esc(comp.unit||'')}${r!==null&&inv?` · <b>${money(r)}</b> realised`:''}</span></div>${d!==null&&ct?bar(d,ct):bar(0,1)}`;
  }
  // asset fulfilment strip (weekly asset schedule)
  let assetStrip='';
  if((comp.assets||[]).length){
    assetStrip=`<div class="assetfulfil-strip">`+comp.assets.map(as=>{
      const del=assetDeliveredTotal(comp,as.id); const target=(+as.perWeek||0)*wl;
      const cls=wl===0?'none':(del>=target?'ok':'under');
      return `<span class="afx ${cls}" title="${esc(as.name)}: contracted ${as.perWeek}/wk">${esc(as.name)} ${del}${wl?'/'+target:''}</span>`;
    }).join('')+`</div>`;
  } else if((comp.entitlements||[]).length){
    assetStrip=`<details class="comp-ent"><summary>${comp.entitlements.length} entitlements</summary><div class="ent-chips">${comp.entitlements.map(e=>`<span class="ent-chip">${esc(e)}</span>`).join('')}</div></details>`;
  }
  // weekly log (internal: view + verify)
  let log='';
  if(wl){
    log=`<details class="wklog"><summary>Weekly log — ${wl} week${wl>1?'s':''}${weeksOf(comp).some(w=>w.status!=='verified')?' · <span style="color:var(--warn)">'+weeksOf(comp).filter(w=>w.status!=='verified').length+' pending</span>':''}</summary>
      <table><thead><tr><th>Week</th><th class="num">Audience</th><th>Status</th><th></th></tr></thead><tbody>
      ${weeksOf(comp).map(w=>`<tr><td>${esc(w.label)}${w.note?` <span style="color:var(--ink-faint);font-size:10px">· ${esc(w.note)}</span>`:''}</td><td class="num">${aud(weekAudTotal(w))}</td>
        <td><span class="wk-status wk-${w.status||'pending'}">${w.status||'pending'}</span></td>
        <td style="text-align:right">${w.status!=='verified'?`<button class="verifybtn" onclick="verifyWeek('${comp.id}','${w.id}')">Verify</button>`:''}</td></tr>`).join('')}
      </tbody></table></details>`;
  }
  return `<div class="comp">
    <div class="comp-head"><div><span class="comp-name">${esc(comp.name)}</span><span class="comp-mode">${comp.mode}</span></div>
      <div style="display:flex;align-items:flex-start;gap:4px"><span class="comp-inv">${money(comp.investment)}<small>investment</small></span><button class="comp-editbtn" onclick="editComponent('${comp.id}')">✎</button></div></div>
    ${body}${assetStrip}${log}
  </div>`;
}
async function verifyWeek(cid,wid){

  const s=curSnap(); const c=s.media.components.find(x=>x.id===cid); const w=c.weeks.find(x=>x.id===wid); if(w){w.status='verified';await persist();render();toast('Week verified');} }

    assetFields=`<div class="wk-sub">Delivered this month</div><div class="wk-grid"><div class="wk-fld"><label>${esc(c.unit||'units')} delivered</label><input type="number" id="wk_qty" value="${w&&w.assets?(w.assets.qty??''):''}"></div></div>`;

      <div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveWeek('${cid}','${wid||''}')">Submit</button></div></div>`,true));

function slug(s){ return s.replace(/[^a-zA-Z0-9]/g,'_'); }
async function saveWeek(cid,wid){
  const s=latestSnap(STATE.partnerships.find(x=>x.id===view.partnerPid));
  const c=s.media.components.find(x=>x.id===cid);
  const label=document.getElementById('w_label').value.trim(); if(!label){toast('Give the month a label, e.g. Jul 2026');return;}
  const note=document.getElementById('w_note').value.trim();
  const audience={}; (c.platforms||[]).forEach(pl=>{ const v=document.getElementById('wa_'+slug(pl)); if(v&&v.value!=='')audience[pl]=+v.value; });
  const assetsObj={};
  if((c.assets||[]).length) c.assets.forEach(as=>{ const v=document.getElementById('wk_'+as.id); if(v&&v.value!=='')assetsObj[as.id]=+v.value; });
  else if(c.mode==='fulfilment'){ const v=document.getElementById('wk_qty'); if(v&&v.value!=='')assetsObj.qty=+v.value; }
  if(SB){
    try{
      if(wid) await sbUpdateWeek(wid,{label,audience,assets:assetsObj,note});
      else await sbInsertWeek({partnership_id:c.partnership_id||view.partnerPid,component_id:cid,label,audience,assets:assetsObj,note});
      await refreshPartner(); closeModal(); toast(wid?'Month updated':'Month submitted');
    }catch(e){ toast('Error: '+e.message); }
    return;
  }
  c.weeks=c.weeks||[];
  if(wid){ const wk=c.weeks.find(x=>x.id===wid); Object.assign(wk,{label,note,audience,assets:assetsObj,status:'pending'}); }
  else c.weeks.push({id:uid(),label,note,audience,assets:assetsObj,status:'pending',submittedAt:new Date().toISOString().slice(0,10)});
  if(c.mode==='fulfilment') c.deliveredQty=c.weeks.reduce((a,w)=>a+(+((w.assets||{}).qty)||0),0);
  await persist(); closeModal(); render(); toast(wid?'Month updated':'Month submitted');
}
async function deleteWeek(cid,wid){
  const s=latestSnap(STATE.partnerships.find(x=>x.id===view.partnerPid));
  const c=s.media.components.find(x=>x.id===cid);
  if(!confirm('Delete this month?'))return;
  if(SB){ try{ await sbDeleteWeek(wid); await refreshPartner(); closeModal(); toast('Deleted'); }catch(e){ toast('Error: '+e.message); } return; }
  c.weeks=(c.weeks||[]).filter(x=>x.id!==wid);
  if(c.mode==='fulfilment') c.deliveredQty=c.weeks.reduce((a,w)=>a+(+((w.assets||{}).qty)||0),0);
  await persist(); closeModal(); render(); toast('Deleted');
}

/* ============================================================ DECISION MODULES ============================================================ */
function setModule(id){ view.module=id; render(); }
function moduleHero(kicker,title,copy,actions=''){
  return `<section class="module-hero"><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${copy}</p>${actions?`<div style="margin-top:14px">${actions}</div>`:''}</section>`;
}
function metricCard(label,value,compare='',tone=''){
  return `<div class="metric-card"><div class="label">${label}</div><div class="value ${tone}">${value}</div>${compare?`<div class="compare">${compare}</div>`:''}</div>`;
}
function metricValue(s,key){
  const m=mediaRoll(s), c=s.commercial||{};
  if(key==='media_value') return m.inv;
  if(key==='reach') return m.del!==null?m.del:m.guar;
  if(key==='cpm') return m.delCpm!==null?m.delCpm:m.propCpm;
  if(key==='ngr') return n(c.ngrAct);
  if(key==='actives') return n(c.activesAct);
  if(key==='delivery'){
    const comps=(s.media.components||[]).filter(x=>(x.assets||[]).length); let target=0,delivered=0;
    comps.forEach(x=>(x.assets||[]).forEach(a=>{target+=(+a.perWeek||0)*verifiedWeeksLogged(x);delivered+=verifiedAssetDeliveredTotal(x,a.id);}));
    return target?delivered/target*100:null;
  }
  return null;
}
function metricFormat(key,v){ if(v===null||v===undefined)return '—'; if(key==='media_value'||key==='ngr')return money(v); if(key==='reach')return aud(v); if(key==='cpm')return '$'+v.toFixed(2); if(key==='delivery')return Math.round(v)+'%'; return num(v); }
function metricDirection(key){return key==='cpm'?'lower':'higher';}
function previousSnapshot(p,s){ const i=p.snapshots.findIndex(x=>x.id===s.id); return i>0?p.snapshots[i-1]:null; }
function benchmarkBase(p,s,key){
  if(view.benchmarkBasis==='previous'){ const prev=previousSnapshot(p,s); return {label:'Previous review',value:prev?metricValue(prev,key):null,sample:prev?1:0}; }
  if(view.benchmarkBasis==='target'){
    const c=s.commercial||{}; const m=mediaRoll(s);
    const maps={ngr:n(c.ngrExp),actives:n(c.activesExp),reach:m.guar,cpm:m.propCpm,delivery:100,media_value:n(p.contractedValue)};
    return {label:'Plan / target',value:maps[key]??null,sample:1};
  }
  const vals=STATE.partnerships.map(x=>metricValue(currentSnap(x),key)).filter(v=>v!==null);
  return {label:'Portfolio average',value:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,sample:vals.length};
}
function deltaInfo(key,current,base){
  if(current===null||base===null||base===0)return {text:'—',cls:'',pct:null};
  const pct=(current-base)/Math.abs(base)*100, favourable=metricDirection(key)==='lower'?pct<=0:pct>=0;
  return {text:`${pct>0?'+':''}${Math.round(pct)}%`,cls:favourable?'good':'bad',pct};
}
function renderBenchmarking(p,s){
  const keys=['media_value','reach','cpm','ngr','actives','delivery'];
  const labels={media_value:'Investment',reach:'Reach',cpm:'CPM',ngr:'Net gaming revenue',actives:'Active customers',delivery:'Entitlement delivery'};
  const basis=keys.map(k=>benchmarkBase(p,s,k)); const first=basis[0];
  const selector=`<select class="sel" style="width:auto" onchange="setBenchmarkBasis(this.value)"><option value="portfolio" ${view.benchmarkBasis==='portfolio'?'selected':''}>Portfolio average</option><option value="previous" ${view.benchmarkBasis==='previous'?'selected':''}>Previous review</option><option value="target" ${view.benchmarkBasis==='target'?'selected':''}>Plan / target</option></select>`;
  let html=moduleHero('Module 02 · metric-level comparison','Benchmarking','Compare individual metrics against a meaningful baseline. No aggregate rank or partnership score is calculated.',selector);
  html+=`<div class="metric-strip">${keys.slice(0,4).map((k,i)=>{const cur=metricValue(s,k),b=basis[i],d=deltaInfo(k,cur,b.value);return metricCard(labels[k],metricFormat(k,cur),`${b.label}: ${metricFormat(k,b.value)} · <span class="delta ${d.cls}">${d.text}</span>`);}).join('')}</div>`;
  html+=`<section class="panel"><div class="panel-head"><h3>Benchmark matrix</h3><span class="lil">${first.sample?`${first.sample} comparable record${first.sample===1?'':'s'}`:'No comparable records'}</span></div><div class="panel-body"><div style="overflow:auto"><table class="dtable"><thead><tr><th>Metric</th><th class="num">Current</th><th class="num">${esc(first.label)}</th><th class="num">Variance</th><th class="num">Direction</th><th>Data quality</th></tr></thead><tbody>${keys.map((k,i)=>{const cur=metricValue(s,k),b=basis[i],d=deltaInfo(k,cur,b.value);const quality=cur===null?'Missing current value':b.value===null?'No valid comparison':'Current data available';return `<tr><td><b>${labels[k]}</b></td><td class="num">${metricFormat(k,cur)}</td><td class="num">${metricFormat(k,b.value)}</td><td class="num"><span class="delta ${d.cls}">${d.text}</span></td><td class="num">${metricDirection(k)==='lower'?'Lower is better':'Higher is better'}</td><td class="muted">${quality}</td></tr>`;}).join('')}</tbody></table></div><div class="data-note">Comparison values are shown only at metric level. Values with no valid denominator or comparison are displayed as an em dash.</div></div></section>`;
  const reach=metricValue(s,'reach'), base=benchmarkBase(p,s,'reach').value, max=Math.max(reach||0,base||0,1); const w1=Math.round((reach||0)/max*100),w2=Math.round((base||0)/max*100);
  html+=`<section class="panel"><div class="panel-head"><h3>Reach comparison</h3><span class="lil">Selected baseline</span></div><div class="panel-body"><div style="font-size:12px;color:var(--ink-soft)">Current partnership <b style="color:var(--ink)">${metricFormat('reach',reach)}</b></div><div class="stackbar"><span style="width:${w1}%;background:var(--accent)"></span></div><div style="font-size:12px;color:var(--ink-soft)">${esc(first.label)} <b style="color:var(--ink)">${metricFormat('reach',base)}</b></div><div class="stackbar"><span style="width:${w2}%;background:#AEB7C6"></span></div><div class="data-note">A deliberately simple comparison chart: it communicates one metric and one baseline, not a composite performance judgement.</div></div></section>`;
  return html;
}
function setBenchmarkBasis(value){view.benchmarkBasis=value;render();}
function defaultCosts(s){
  const total=mediaRoll(s).inv||0;
  if(!Array.isArray(s.costEntries)||!s.costEntries.length){
    s.costEntries=[{category:'Rights fee',amount:total,currency:'AUD',state:'Actual',note:'Derived from existing media package investment',auto:true}];
  } else if(s.costEntries.length===1 && s.costEntries[0].auto){
    /* still on the untouched auto line — keep it pinned to the live component total so it can't go stale */
    s.costEntries[0].amount=total;
  }
  return s.costEntries;
}
function efficiencyOutputs(s){const m=mediaRoll(s),c=s.commercial||{};return {reach:m.del!==null?m.del:m.guar,impressions:null,views:null,clicks:null,signups:null,ftds:null,actives:n(c.activesAct),ngr:n(c.ngrAct)};}
function renderEfficiency(p,s){
  const costs=defaultCosts(s), total=costs.reduce((a,x)=>a+(n(x.amount)||0),0),o=efficiencyOutputs(s);
  const calc=[['Cost per reach',o.reach?total/o.reach:null,'currency'],['CPM',o.impressions?total/o.impressions*1000:null,'currency'],['Cost per active customer',o.actives?total/o.actives:null,'currency'],['NGR per dollar invested',total&&o.ngr!==null?o.ngr/total:null,'ratio']];
  let html=moduleHero('Module 03 · operational finance','Commercial efficiency','See how approved investment converts into media and commercial outcomes. Status is always tied to a named metric—not a rolled-up score.',`<button class="btn btn-primary" onclick="editCosts()">Edit investment ledger</button>`);
  html+=`<div class="metric-strip">${metricCard('Total investment',money(total),'Actual costs recorded')}${metricCard('Reach',metricFormat('reach',o.reach),'Delivered or guaranteed reach')}${metricCard('Active customers',num(o.actives),'Attributable outcomes')}${metricCard('NGR',money(o.ngr),'Attributable outcomes')}</div>`;
  const colors=['#2F6BE0','#7A5AF8','#1D9A6C','#EC7B4E','#AEB7C6']; let off=0;
  const autoLinked=costs.length===1 && costs[0].auto;
  html+=`<div class="grid2"><section class="panel"><div class="panel-head"><h3>Investment breakdown</h3><span class="lil">${costs.length} cost categor${costs.length===1?'y':'ies'}</span></div><div class="panel-body"><div class="stackbar">${costs.map((x,i)=>{const w=total?((n(x.amount)||0)/total*100):0,col=colors[i%colors.length];off+=w;return `<span style="width:${w}%;background:${col}" title="${esc(x.category)}"></span>`;}).join('')}</div><div class="legend">${costs.map((x,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(x.category)} ${money(x.amount)}</span>`).join('')}</div><div class="data-note">${autoLinked?'Auto-synced to the media package investment total — edit the ledger to break this link and set costs manually.':'Manually set — no longer auto-synced to media package investment.'} Partner users never see this ledger.</div></div></section><section class="panel"><div class="panel-head"><h3>Efficiency metrics</h3><span class="lil">Formula driven</span></div><div class="panel-body"><table class="dtable"><tbody>${calc.map(([l,v,type])=>`<tr><td><b>${l}</b></td><td class="num">${v===null?'—':type==='ratio'?v.toFixed(2)+'×':money(v)}</td></tr>`).join('')}</tbody></table><div class="data-note">Missing denominators show as an em dash. “NGR per dollar invested” is not labelled ROI.</div></div></section></div>`;
  const funnel=[['Reach',o.reach],['Clicks',o.clicks],['Sign-ups',o.signups],['FTDs',o.ftds],['Active',o.actives]];
  html+=`<section class="panel"><div class="panel-head"><h3>Commercial funnel</h3><span class="lil">Available data only</span></div><div class="panel-body"><div class="funnel">${funnel.map(([l,v])=>`<div class="funnel-step"><div class="fnum">${l==='Reach'?aud(v):num(v)}</div><div class="flab">${l}</div></div>`).join('')}</div><div class="data-note">The funnel intentionally leaves unavailable stages blank; it does not estimate conversion or invent attribution.</div></div></section>`;
  return html;
}
function editCosts(){const s=curSnap(),costs=defaultCosts(s);mount(scrim(`<div class="modal-head"><h3>Investment ledger</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><p style="margin-top:0;color:var(--ink-soft);font-size:13px">Keep costs internal. Each line is included in total investment.</p><div id="costRows">${costs.map((x,i)=>costRow(x,i)).join('')}</div><button class="linkbtn" onclick="addCostRow()">＋ Add cost category</button></div><div class="modal-foot"><div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCosts()">Save ledger</button></div></div>`,true));}
function costRow(x,i){return `<div class="frow" style="margin-bottom:10px"><div class="field" style="margin:0"><label>Category</label><input class="inp" data-cost="category" value="${esc(x.category||'')}"></div><div class="field" style="margin:0"><label>Amount (AUD)</label><input class="inp" data-cost="amount" type="number" min="0" value="${n(x.amount)??''}"></div></div>`;}

async function saveCosts(){const fields=[...document.querySelectorAll('[data-cost]')],rows=[];for(let i=0;i<fields.length;i+=2){const category=fields[i].value.trim(),amount=n(fields[i+1].value);if(category&&amount!==null)rows.push({category,amount,currency:'AUD',state:'Actual',note:''});}curSnap().costEntries=rows;await persist();closeModal();render();toast('Investment ledger saved');}
function executiveFacts(s){const a=s.assessment||blankAssess(), m=mediaRoll(s), c=s.commercial||{};const highlights=[...(a.winning||[])],risks=[...(a.falling||[])],opps=[...(a.evolution||[])];if(!highlights.length&&m.del!==null&&m.guar!==null&&m.del>=m.guar)highlights.push(`Audience delivery is ${Math.round((m.del-m.guar)/m.guar*100)}% above guarantee.`);if(!risks.length&&m.del===null)risks.push('Delivered audience has not been recorded for this review point.');if(!opps.length)opps.push('Confirm the next review priorities with the partnership owner.');return {highlights:highlights.slice(0,5),risks:risks.slice(0,5),opps:opps.slice(0,5),m,c};}
function renderExecutive(p,s){const f=executiveFacts(s),action=s.call||'not set',label={'renew':'Renew','evolve':'Renew with revised terms','renegotiate':'Renew with revised terms','exit':'Exit','not set':'Not set'}[action]||'Not set';const status={good:'Performing above expectations',warn:'Mixed performance',bad:'Requires commercial review'}[s.status]||'Insufficient data';const metrics=[['Investment',money(mediaRoll(s).inv)],['Reach',metricFormat('reach',metricValue(s,'reach'))],['NGR',money(n(s.commercial.ngrAct))],['Delivery',metricFormat('delivery',metricValue(s,'delivery'))]];
 let html=moduleHero('Module 04 · board-ready view','Executive summary','A concise, printable decision surface. It presents named evidence and a recommended action—never an overall partnership score.',`<button class="btn btn-ghost" onclick="window.print()">Print / save PDF</button>`);
 html+=`<div class="metric-strip">${metrics.map(x=>metricCard(x[0],x[1],`As at ${fmtDate(s.date)}`)).join('')}</div><div class="summary-grid"><div><section class="panel"><div class="panel-head"><h3>Decision brief</h3><span class="lil">${status}</span></div><div class="panel-body"><h4 style="margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--good)">Key achievements</h4><ul class="summary-list">${f.highlights.map(x=>`<li>✓ ${esc(x)}<span class="evidence">Source: assessment or verified delivery</span></li>`).join('')}</ul><h4 style="margin:18px 0 8px;font-size:12px;text-transform:uppercase;color:var(--bad)">Risks</h4><ul class="summary-list">${f.risks.map(x=>`<li>⚠ ${esc(x)}<span class="evidence">Owner: partnership lead</span></li>`).join('')}</ul><h4 style="margin:18px 0 8px;font-size:12px;text-transform:uppercase;color:var(--accent)">Opportunities</h4><ul class="summary-list">${f.opps.map(x=>`<li>• ${esc(x)}</li>`).join('')}</ul></div></section></div><aside><div class="decision-card"><div style="font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.06em">Recommended action</div><div class="decision">${label}</div><div style="font-size:12.5px;color:var(--ink-soft)">${s.verdict?esc(s.verdict):'Add a verdict to document the decision rationale.'}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${CALLS.map(x=>`<button class="chip ${s.call===x?'on':''}" onclick="setCall('${x}')">${x==='renegotiate'?'Revised terms':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div><section class="panel" style="margin-top:18px"><div class="panel-head"><h3>Timeline</h3></div><div class="panel-body"><div class="timeline"><div>Next review<small>${fmtDate(s.date)} · partnership owner</small></div><div>Negotiation window<small>Confirm with commercial lead</small></div><div>Contract expiry<small>${fmtDate(p.termEnd) || 'Not recorded'}</small></div><div>Activation planning<small>Before next review period</small></div></div></div></section></aside></div>`;return html;}
function renderAIInsights(p,s){const f=executiveFacts(s),m=f.m,c=f.c;const change=m.del!==null&&m.guar!==null?`Audience delivery is ${Math.round((m.del-m.guar)/m.guar*100)}% against the current guarantee.`:'Audience delivery is not yet complete enough to compare with the guarantee.';const commercial=n(c.ngrAct)!==null?`Attributable NGR is ${money(c.ngrAct)}${n(c.ngrExp)!==null?` against ${money(c.ngrExp)} expected`:''}.`:'No attributable NGR has been recorded in this review point.';let html=moduleHero('Module 05 · reviewer-assisted drafting','AI partnership insights','Evidence-grounded drafts to help reviewers prepare a summary, risks and negotiation points. Review and edit before sharing.',`<button class="btn btn-primary" onclick="editAssessment()">Review source evidence</button>`);html+=`<section class="panel"><div class="panel-head"><h3>Draft executive summary</h3><span class="lil">Human review required</span></div><div class="panel-body"><div class="insight">${esc(p.name)} is currently marked ${s.status==='good'?'on track':s.status==='warn'?'for review':'with insufficient or mixed evidence'}. ${change} ${commercial} The current recommended action is ${s.call?esc(s.call):'not set'}.</div><div class="grid2"><div><h4 style="margin:0 0 8px">Strengths</h4><ul class="summary-list">${f.highlights.map(x=>`<li>✓ ${esc(x)}</li>`).join('')}</ul><h4 style="margin:18px 0 8px">Risks to validate</h4><ul class="summary-list">${f.risks.map(x=>`<li>⚠ ${esc(x)}</li>`).join('')}</ul></div><div><h4 style="margin:0 0 8px">Opportunities</h4><ul class="summary-list">${f.opps.map(x=>`<li>• ${esc(x)}</li>`).join('')}</ul><h4 style="margin:18px 0 8px">Negotiation prompts</h4><ul class="summary-list"><li>Confirm inventory and delivery commitments for the next period.</li><li>Use the metric-level benchmark view to identify the specific terms to improve.</li><li>Replace unused assets with measurable digital or content inventory where appropriate.</li></ul></div></div><div class="ai-note">Grounding: this draft uses only the selected snapshot’s commercial results, media delivery, assessment and verdict. It does not infer missing values or send anything automatically.</div></div></section>`;return html;}

async function saveComponent(cid){

    <textarea class="inp" id="lv_${key}_n" rows="2" placeholder="Short note">${esc(d.note||'')}</textarea></div>`; };

    <div class="modal-body">

      <div class="frow" style="margin-top:8px"><div class="field"><label>Topline deliverables</label>${ta('a_deliv',a.deliverables)}</div><div class="field"><label>Where we're winning</label>${ta('a_win',a.winning)}</div></div>
      <div class="frow"><div class="field"><label>Where we're falling down</label>${ta('a_fall',a.falling)}</div><div class="field"><label>Next evolution</label>${ta('a_evo',a.evolution)}</div></div>
      <label style="font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600">Strategic levers</label>
      <div style="margin-top:8px">${LEVERS.map(([k,l])=>lv(k,l)).join('')}</div>
    </div>
    <div class="modal-foot"><div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAssessment()">Save</button></div></div>`,true));
}
async function saveAssessment(){
  const a=curSnap().assessment;
  const lines=id=>document.getElementById(id).value.split('\n').map(x=>x.trim()).filter(Boolean);

  await persist(); closeModal(); render(); toast('Assessment saved');

      view.email=session.user.email;

      const {data:owner}=await SB.from('pr_owner').select('email').eq('email',view.email).maybeSingle();
      if(owner){ view.role='owner'; view.mode='internal'; STATE=await db.load(); if(!STATE||!STATE.partnerships){STATE=seed();await db.save(STATE);} await ownerRefreshWeeks(); render(); return; }
      // partner?
      view.role='partner'; view.mode='partner'; await loadPartnerData();
      if(STATE.partnerships.length){ render(); return; }
      renderNoAccess(); return;
    }catch(e){ console.error(e); renderLogin('Something went wrong connecting. Check the console.'); return; }
  }
  // local mode (no anon key yet) — works exactly as before
  STATE=await db.load(); if(!STATE||!STATE.partnerships){STATE=seed();await persist();} render();
})();
</script>
</body>
</html>
